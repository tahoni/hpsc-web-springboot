name: Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build, test and check coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and enforce coverage
        run: sh ./mvnw --batch-mode verify -Pcoverage

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  migrations:
    name: Run Flyway migrations against MySQL
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # A throwaway MySQL, matching the version docker-compose.yml runs; the credentials are only valid inside this job
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: hpsc_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      FLYWAY_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/hpsc_ci
      FLYWAY_MYSQL_USER: root
      FLYWAY_MYSQL_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The test profile bypasses Flyway on H2, so this is the only place the migrations meet MySQL
      - name: Run the Flyway migrations against MySQL
        run: sh ./mvnw --batch-mode test -Dtest=FlywayMysqlMigrationTest

name: Dependency Submission

# Explicit replacement for GitHub's built-in "Automatic Dependency Submission (Maven)" workflow, so the
# snapshot is built with the project's own JDK and Maven wrapper rather than the built-in default (JDK 21,
# wrapper ignored). Turn off Settings → Code security → Dependency graph → "Automatic dependency submission"
# once this workflow is in place, or both will submit snapshots.

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  submit-maven:
    name: Submit Maven dependencies
    runs-on: ubuntu-latest
    permissions:
      # Writing a dependency snapshot to the repository's dependency graph needs write access
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # mvnw is committed without its executable bit (build.yml runs it through `sh` instead), but this
      # action executes the wrapper directly
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6

name: Docker Image

# Builds the Dockerfile so a change that breaks the image fails CI rather than surfacing at deployment. The image is
# built only, never pushed. Tests run in build.yml, and the Dockerfile skips them.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hpsc-web:ci
          # Reuse layers across runs through the GitHub Actions cache, so unchanged dependency layers aren't rebuilt
          cache-from: type=gha
          cache-to: type=gha,mode=max

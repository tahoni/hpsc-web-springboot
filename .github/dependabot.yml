# Dependabot version updates. Security updates are enabled separately in the repository's Code security settings
# and ignore target-branch, so those PRs still open against the default branch (main) — they're handled as hotfixes
# (merge into main, then merge main back into develop); see AGENTS.md's Branching Model.
version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    # GitFlow: day-to-day changes land on develop first, never main
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for all backward-compatible bumps; major bumps still get a PR each
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

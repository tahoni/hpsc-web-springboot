# STANDARD
## Application
spring.application.name=hpsc-web
spring.main.banner-mode=log
server.servlet.context-path=/hpsc-web
server.port=8081
## Database
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.show-sql=false
## Database migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The v6.0.0 schema predates Flyway and was created manually; baseline it as version 6.0.0
# instead of trying to script its creation, so Flyway only applies migrations from v7.0.0 on.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6.0.0
spring.flyway.baseline-description=v6.0.0 schema (manually managed, pre-Flyway)
# Data pool
# https://github.com/brettwooldridge/HikariCP
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
# Data conversion
spring.jackson.mapper.accept_case_insensitive_properties=true
# Development
spring.devtools.add-properties=false
# APPLICATION
hpsc.web.app.club.filter.abbreviation=HPSC

# STANDARD
## Database
spring.datasource.url=jdbc:mysql://localhost:3306/hpsc_prod
spring.datasource.username=hpsc_prod
# Schema is Flyway-managed (ddl-auto=none and spring.flyway.enabled/locations inherited from
# application.properties). Like the local database, the production database was built out to the
# v7.0.0 shape by hand before Flyway ran at startup, so a non-empty schema without Flyway's history
# is baselined at 7.0.0 and V7_1_0 onwards are applied on top. An empty database (e.g. the Docker
# Compose one) is never baselined -- Flyway creates the full schema from V7_0_0 instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=7.0.0
spring.flyway.baseline-description=v7.0.0 schema (built by hand, pre-Flyway)

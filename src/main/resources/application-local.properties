# STANDARD
## Database
spring.datasource.url=jdbc:mysql://localhost:3306/hpsc_dev
spring.datasource.username=hpsc_dev
spring.datasource.password=${MYSQL_LOCAL_PASSWORD}
# This local database starts empty, so Hibernate generates/updates the schema directly from the
# entities instead of going through the Flyway migrations (which assume a pre-existing v6.0.0
# schema to alter -- see src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

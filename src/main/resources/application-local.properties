# STANDARD
## Database
spring.datasource.url=jdbc:mysql://localhost:3306/hpsc_dev
spring.datasource.username=hpsc_dev
spring.datasource.password=${MYSQL_LOCAL_PASSWORD}
# Schema is Flyway-managed (ddl-auto=none and spring.flyway.enabled/locations inherited from
# application.properties). This particular local database was already built out to the v7.0.0
# shape by hand (via ddl-auto=update) before Flyway was wired up, so it's baselined at 7.0.0
# instead of assuming empty -- Flyway marks it as already-current on first run rather than
# trying to replay V7_0_0__create_schema.sql against tables that already exist.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=7.0.0
spring.flyway.baseline-description=v7.0.0 schema (built by hand via ddl-auto=update, pre-Flyway)
